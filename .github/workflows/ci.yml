# Public CI. Unlimited Actions minutes on public repos.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build ./...
      - run: go vet ./...
      # The module must compile (tests included) off linux; linux-only syscalls
      # sit behind build tags.
      - run: GOOS=darwin go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
