# Tracked merge gate for this repo. loadout-merge reads these keys from this
# file as it exists at the PR's base commit, so a PR cannot relax its own gate
# and a gate change is reviewed like any other change. Machine-local keys
# (post_merge_steps, host paths) and the roles: taxonomy stay in config.yaml.
merge:
  # required_reviewer_roles (lr-9c7f47): WHY THIS GATE EXISTS HERE, SPECIFICALLY
  # -- the post_merge_steps step in config.yaml does not just land code on
  # main, it rebuilds and reinstalls (`make install PREFIX=/usr/local`) the
  # role-scoped MINT BINARY the rest of the fleet depends on for token
  # issuance. Before this key was declared, this repo's merge: section
  # (authorized_roles is not declared here either, which is safely
  # fail-CLOSED per loadout's own absence semantics -- see
  # clagentic_loadout.merge.gate_config's module docstring) gated only WHO
  # may merge, never WHETHER anyone reviewed the change --
  # loadout's absence semantics make required_reviewer_roles fail-OPEN on
  # omission, so a merge: section with no post_merge_steps risk would already
  # be worth closing, and one whose post_merge_steps redeploys fleet-wide
  # credential-minting infrastructure makes an unreviewed merge here the
  # highest-stakes instance of that gap in the fleet (lr-9c7f47 comment #1).
  # Do not "simplify" this away back to an absent key or an empty list --
  # that is the exact silent fail-open this task exists to close.
  required_reviewer_roles: [reviewer, security]
