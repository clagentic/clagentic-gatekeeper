# .clagentic/loadout/config.yaml — clagentic-gatekeeper repo-local loadout
# config (lr-3fa652).
#
# Schema: clagentic_loadout.merge.post_merge_config — the `merge:` top-level
# section, `post_merge_steps` key (a list of step mappings; see
# clagentic_loadout.merge.post_merge.run_post_merge_steps for the step
# shape: cmd, description, on_failure).
#
# WHY THIS FILE EXISTS: NAOMI merges this repo's PRs via loadout-merge on
# GitHub (the sole reachable GitHub merge entrypoint, lr-d9729d).
# loadout-merge reads ITS OWN post_merge_steps from this repo-local file —
# it does NOT read .crew/naomi.yaml's post_merge_steps (that block is
# crew_merge.py's own Forgejo-path config, read by a different merge tool
# entirely). Before this file existed, a GitHub merge via loadout-merge ran
# no post-merge step at all, leaving the deployed /usr/local/bin/gatekeeper
# binary stale relative to origin/main (root cause of a reader mint
# resolving against an old single-sidecar binary that predated the
# attestation.sidecars list).
#
# This step is migrated verbatim (same cmd, same on_failure) from
# .crew/naomi.yaml's post_merge_steps (see that file's own extensive
# lr-c05c / lr-6e96 / lr-f193 history on why the step is a single command
# with no shell operators) — .crew/naomi.yaml is left UNCHANGED; it remains
# the config crew_merge.py's own Forgejo fallback path reads.
#
# The steps run against the merged SHA with no checkout/sync step added here.
# loadout-merge advances the working tree in place only when it is a clean
# checkout of the base branch; otherwise it runs the steps in a tool-owned git
# worktree detached at the merged SHA and exports its path as
# CLAGENTIC_LOADOUT_MERGE_TREE. Go's VCS stamping gave no commit in that tree,
# so the install step passes the commit explicitly (see step 0).
#
# GOPATH/GOMODCACHE/GOCACHE are supplied inline on the cmd, matching
# .crew/naomi.yaml's existing step exactly: these are machine-specific
# values, and the loadout post_merge_env deployment-owned override seam
# (lr-52d7, clagentic_loadout.merge.post_merge_config.resolve_env_overrides)
# is deliberately USER-LEVEL config only (~/.config/clagentic/loadout/
# config.yaml, outside any repo checkout) — it is not a field this
# repo-local, committed file can populate itself. Baking the same
# our-env-only values inline here mirrors the already-working .crew step
# rather than inventing a partial/inconsistent split between the two merge
# paths.
merge:
  post_merge_steps:
    # COMMIT={merged_sha}: loadout substitutes the documented {merged_sha}
    # placeholder with the merged commit in both loadout-merge and
    # loadout-post-merge (the same value is exported as
    # CLAGENTIC_LOADOUT_MERGED_SHA), and the Makefile links it in as
    # main.buildCommit.
    - cmd: "GOPATH=/root/go GOMODCACHE=/root/go/pkg/mod GOCACHE=/root/.cache/go make install PREFIX=/usr/local COMMIT={merged_sha}"
      description: "Rebuild and install the role-scoped mint binary via the shared parameterized `make install` target so reference-role changes (e.g. builder workflows:write, lr-8681; multi-sidecar attestation.sidecars, lr-86779f) take effect on this host without a manual redeploy. GOPATH/GOMODCACHE/GOCACHE/PREFIX are supplied inline here, our-env-only, off the shipped Makefile's own defaults. COMMIT comes from the {merged_sha} placeholder that loadout substitutes with the merged commit before the step runs, not from git or Go's VCS stamping, so the installed binary reports the merged commit. Runs against the merged commit in the tree loadout prepares before invoking post_merge_steps."
      on_failure: fail
    # Readback of the install above: the installed binary prints the commit and
    # dirty flag it was built from, so the merge output carries what is now
    # deployed. Same single-command, no-shell-operator shape as the step above;
    # the path follows that step's PREFIX. on_failure is warn because the step
    # schema allows only fail or warn, and a failed readback must not report a
    # merge whose install passed as failed. The step above passes
    # COMMIT={merged_sha}, so this readback is expected to show commit equal to
    # the merged SHA with commit_source build_flag.
    - cmd: "/usr/local/bin/gatekeeper version --json"
      description: "Read back the installed gatekeeper binary's source commit and dirty flag. Expected: commit equal to the merged SHA (supplied by the {merged_sha} placeholder in the install step) with commit_source build_flag; commit null or commit_source none means the install did not receive the commit."
      on_failure: warn
    # Live harness against an isolated serve, without a runtime CLI: self-check
    # (fresh, and stale after one byte of the key set file changes) and an
    # old-kid token after a key rotation. Its output lands in the merge result.
    # Same inline Go env values as the install step; a single command with no
    # shell operators. on_failure is warn: the install already passed.
    - cmd: "GOPATH=/root/go GOMODCACHE=/root/go/pkg/mod GOCACHE=/root/.cache/go make live-test LIVETEST_ARGS=--no-runtime"
      description: "Run the live harness on the merged tree without a runtime CLI: self-check fresh and stale, and old-kid verification after a key rotation."
      on_failure: warn

# roles (lr-9c7f47): this repo declares its OWN role -> verb-set taxonomy
# rather than relying on provisioning.roles.DEFAULT_ROLE_VERBS, so that the
# `security` role named in merge.required_reviewer_roles in gate.yaml is not merely
# accepted with a WARN (the fallback-taxonomy shape) but is a real,
# provisioned role this repo's own config vouches for. Declaring this
# section means doctor's cross-check is now load-bearing: every gate role
# in merge.required_reviewer_roles / merge.authorized_roles MUST have a key
# here or doctor hard-fails (an unsatisfiable gate is worse than an absent
# one, because it reads as protection -- clagentic_loadout.doctor.checks).
# Verb sets below mirror provisioning.roles.DEFAULT_ROLE_VERBS for the roles
# this repo shares with the reference taxonomy (builder, reviewer, merger,
# lead), extended with a security role using the same reviewer-class verb
# set (git-host-api, review-post, stage-body) that a security-audit gate
# needs to read a PR diff and post its own verdict.
roles:
  builder:
    - push
  reviewer:
    - git-host-api
    - review-post
    - stage-body
  security:
    - git-host-api
    - review-post
    - stage-body
  merger:
    - merge
    - push
    - release-dispatch
    - release-detect
  lead:
    - git-host-api
